services:
  - type: web
    name: mdndn-lifeos
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: python -m gunicorn vision30.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.12.10"
