{% load static %}
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0f0d0a"><title>Sign in · Vision 30</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="{% static 'css/lifeos-app.css' %}"><link rel="stylesheet" href="{% static 'css/vision30.css' %}"></head>
<body class="login-page" data-theme="dark"><main class="card login-card"><p class="eyebrow">Private personal workspace</p><h1>Vision 30</h1><p>Sign in to your Life OS.</p>{% if form.errors %}<p class="message error" role="alert">The username or password was not recognized.</p>{% endif %}<form method="post">{% csrf_token %}<label>Username<input name="username" autocomplete="username" required autofocus></label><label>Password<input type="password" name="password" autocomplete="current-password" required></label><input type="hidden" name="next" value="{{ next }}"><button class="primary-btn" type="submit">Sign in</button></form><p class="small muted">Create your first account with <code>python manage.py createsuperuser</code>.</p></main></body></html>
